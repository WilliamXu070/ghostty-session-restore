# newmux development tmux config.
#
# This config gives the fork a visible test surface before the real recovery
# commands exist.

set-option -g status off
set-option -g status-left " newmux #[bold]#{session_name}#[default] "
set-option -g status-right " #{version} | %H:%M "
set-option -g set-titles on
set-option -g set-titles-string "#{session_name} — #{window_index}:#{window_name}"
set-option -g history-limit 200000
set-option -g remain-on-exit on
set-option -g mouse on
set-option -s copy-command "/Users/williamxu/Desktop/Projects/newmux/scripts/newmux-copy-to-clipboard.sh"
set-environment -g ZDOTDIR "/Users/williamxu/Desktop/Projects/newmux/config/newmux-zsh"
set-environment -g NEWMUX_ZSH_DISABLE_RPROMPT "1"
set-option -s user-keys[0] "\033[5;7788~"
set-option -s user-keys[1] "\033[5;7789~"
set-option -s user-keys[2] "\033[5;7790~"

# Newmux scroll testing:
#   mode 1 = smoothed/scaled wheel input
#   mode 2 = exactly one line per emitted wheel tick, capped by rate only
set-window-option -g newmux-scroll-mode 1
set-window-option -g newmux-scroll-single-line-max-up 1000
set-window-option -g newmux-scroll-single-line-max-down 640

bind-key R source-file "/Users/williamxu/Desktop/Projects/newmux/config/newmux-dev.tmux.conf" \; display-message "newmux config reloaded"

# Browser-style pane/window soft delete and restore stack.
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key V split-window -v -c "#{pane_current_path}"
bind-key D if-shell -F "#{>:#{window_panes},1}" "newmux-soft-delete-pane"
bind-key N new-window -c "#{pane_current_path}"
bind-key W newmux-soft-delete-window
bind-key T newmux-reopen-latest-closed
bind-key M run-shell -b "/Users/williamxu/Desktop/Projects/newmux/scripts/request-newmux-restore-tab.sh '#{socket_path}'"
bind-key -n User0 run-shell -b "python3 /Users/williamxu/Desktop/Projects/newmux/scripts/newmux-ui-bridge.py key-event --key 'cmd+shift+t' --socket-path '#{socket_path}' --target-pane '#{pane_id}' >/dev/null 2>&1 ; /Users/williamxu/Desktop/Projects/newmux/scripts/request-newmux-restore-tab.sh '#{socket_path}' >/dev/null 2>&1"
bind-key -n User1 run-shell -b "NEWMUX_NEW_TAB_OPEN_TAB=0 /Users/williamxu/Desktop/Projects/newmux/scripts/request-newmux-new-tab.sh '#{socket_path}' '#{pane_id}' >/dev/null 2>&1"
bind-key -n User2 run-shell -b "python3 /Users/williamxu/Desktop/Projects/newmux/scripts/newmux-ui-bridge.py key-event --key 'cmd+w' --socket-path '#{socket_path}' --target-pane '#{pane_id}' >/dev/null 2>&1 ; python3 /Users/williamxu/Desktop/Projects/newmux/scripts/newmux-runtime.py delete --socket-path '#{socket_path}' --target-pane '#{pane_id}' >/dev/null 2>&1"
bind-key -n M-Right next-window
bind-key -n M-Left previous-window

# Current test target: enter live copy mode. Hide tmux's position overlay so
# one-line scrolling does not need to repaint extra cleanup rows each tick.
bind-key H copy-mode -LHe

# Trackpad/wheel history test path. Scrolling up enters copy mode and moves
# into tmux scrollback; scrolling down moves back toward live output.
bind-key -n WheelUpPane if-shell -F "#{pane_in_mode}" "send-keys -M" "if-shell -F '#{>:#{history_size},0}' 'copy-mode -LHe ; send-keys -X scroll-up'"
bind-key -n MouseDrag1Pane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -LHeM"
bind-key -T copy-mode WheelUpPane send-keys -N 1 -X scroll-up
bind-key -T copy-mode WheelDownPane send-keys -N 1 -X scroll-down
bind-key -T copy-mode-vi WheelUpPane send-keys -N 1 -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -N 1 -X scroll-down

# Native-feeling selection test path. Dragging text in live history should leave
# a local highlight in place like macOS Terminal; mouse-up copies without
# clearing, and click or type dismisses it.
bind-key -T copy-mode MouseDown1Pane select-pane \; send-keys -X clear-selection
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X stop-selection \; send-keys -X copy-pipe-no-clear '/Users/williamxu/Desktop/Projects/newmux/scripts/newmux-copy-to-clipboard.sh'
bind-key -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection \; send-keys -X copy-pipe-no-clear '/Users/williamxu/Desktop/Projects/newmux/scripts/newmux-copy-to-clipboard.sh'
